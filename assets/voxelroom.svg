<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <defs>
    <clipPath id="squircleVoxelRoom">
      <rect x="0" y="0" width="108" height="108" rx="24" ry="24"/>
    </clipPath>
    <linearGradient id="bgVoxelRoom" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glowDoor" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#FDE047" flood-opacity="0.8"/>
    </filter>
  </defs>
  <g clip-path="url(#squircleVoxelRoom)">
    <rect width="108" height="108" fill="url(#bgVoxelRoom)"/>

    <!-- Isometric Room Walls -->
    <!-- Left wall -->
    <polygon points="14,32 54,54 54,94 14,72" fill="#312E81"/>
    <!-- Right wall -->
    <polygon points="54,54 94,32 94,72 54,94" fill="#1E1B4B"/>
    <!-- Floor tiles grid perspective -->
    <polygon points="54,94 14,72 54,52 94,72" fill="#4338CA" fill-opacity="0.25"/>

    <!-- Escape Door with mysterious glowing light -->
    <g filter="url(#glowDoor)">
      <polygon points="26,45 42,54 42,82 26,73" fill="#FDE047"/>
      <polygon points="28,48 40,55 40,80 28,73" fill="#FEF08A"/>
    </g>

    <!-- Voxel Furniture / Chest / Logic cube -->
    <polygon points="68,66 80,60 80,72 68,78" fill="#F59E0B"/>
    <polygon points="68,66 56,60 56,72 68,78" fill="#D97706"/>
    <polygon points="68,66 80,60 68,54 56,60" fill="#FBBF24"/>

    <!-- Key icon hovering -->
    <circle cx="74" cy="44" r="5" fill="none" stroke="#67E8F9" stroke-width="2"/>
    <path d="M78 47L86 55M82 51L85 48" stroke="#67E8F9" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
