<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <defs>
    <clipPath id="squircleTrace">
      <rect x="0" y="0" width="108" height="108" rx="24" ry="24"/>
    </clipPath>
    <linearGradient id="bgTrace" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E2A36"/>
      <stop offset="50%" stop-color="#091E27"/>
      <stop offset="100%" stop-color="#051218"/>
    </linearGradient>
    <filter id="shadowTrace" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <g clip-path="url(#squircleTrace)">
    <rect width="108" height="108" fill="url(#bgTrace)"/>
    <!-- Incident Response / Forensic Timeline grid -->
    <path d="M16 86H92" stroke="#1F6F8B" stroke-width="2" stroke-linecap="round"/>
    <circle cx="28" cy="86" r="3" fill="#3FA66B"/>
    <circle cx="54" cy="86" r="3" fill="#E8702A"/>
    <circle cx="80" cy="86" r="3" fill="#D32F2F"/>

    <!-- Process Execution Tree -->
    <g filter="url(#shadowTrace)">
      <path stroke="#7FD0EC" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"
            d="M38 50H50M50 32V68M50 32H64M50 50H64M50 68H64"/>
      <!-- Parent process -->
      <rect x="22" y="42" width="16" height="16" rx="4" fill="#E6F6FC" stroke="#7FD0EC" stroke-width="1.5"/>
      <!-- Normal child 1 -->
      <rect x="64" y="24" width="16" height="16" rx="4" fill="#7FD0EC" stroke="#E6F6FC" stroke-width="1.5"/>
      <!-- Suspicious / Flagged Sysmon alert child -->
      <rect x="64" y="42" width="16" height="16" rx="4" fill="#E8702A" stroke="#FFD8A8" stroke-width="1.5"/>
      <!-- Normal child 2 -->
      <rect x="64" y="60" width="16" height="16" rx="4" fill="#7FD0EC" stroke="#E6F6FC" stroke-width="1.5"/>

      <!-- Magnifying Glass / Forensic Analyzer indicator -->
      <circle cx="72" cy="50" r="14" fill="none" stroke="#67E8F9" stroke-width="2.5" stroke-dasharray="3 2"/>
    </g>
  </g>
</svg>
