<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <defs>
    <clipPath id="squircleSprig">
      <rect x="0" y="0" width="108" height="108" rx="24" ry="24"/>
    </clipPath>
    <linearGradient id="bgSprig" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F1713"/>
      <stop offset="50%" stop-color="#14241B"/>
      <stop offset="100%" stop-color="#0A120D"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D1FAE5"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadowSprig" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#047857" flood-opacity="0.4"/>
    </filter>
  </defs>
  <g clip-path="url(#squircleSprig)">
    <rect width="108" height="108" fill="url(#bgSprig)"/>
    <!-- Cyber network grid lines -->
    <path d="M14 36H94M14 54H94M14 72H94" stroke="#064E3B" stroke-width="1.2" stroke-dasharray="3 3"/>
    <path d="M36 14V94M54 14V94M72 14V94" stroke="#064E3B" stroke-width="1.2" stroke-dasharray="3 3"/>

    <!-- Security Shield (Intercept & Inspection Workspace) -->
    <g filter="url(#shadowSprig)">
      <path d="M54 18L24 31V54C24 72 37 87 54 92C71 87 84 72 84 54V31L54 18Z" fill="url(#shieldGrad)" stroke="#6EE7B7" stroke-width="2" stroke-linejoin="round"/>
      <!-- Intercept data streams -->
      <path d="M42 41H66M37 51H71M42 61H66" stroke="#064E3B" stroke-width="4.5" stroke-linecap="round"/>
      <!-- Intercept indicator glow -->
      <circle cx="54" cy="51" r="3.5" fill="#FDE047"/>
    </g>
  </g>
</svg>
