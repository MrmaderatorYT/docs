<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 108 108">
  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="108" height="108" rx="24" ry="24"/>
    </clipPath>
    <linearGradient id="krokGrad" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F9575"/>
      <stop offset="1" stop-color="#1A5E49"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- Background linear gradient from Krok app/src/main/res/drawable/ic_launcher_background.xml -->
    <rect width="108" height="108" fill="url(#krokGrad)"/>

    <!-- Soft highlight sweeping in from top-right corner -->
    <circle cx="78" cy="-8" r="48" fill="#FFFFFF" fill-opacity="0.086"/>

    <!-- Soft shadow at bottom-left -->
    <circle cx="22" cy="124" r="42" fill="#000000" fill-opacity="0.063"/>

    <!-- Authentic foreground from Krok app/src/main/res/drawable/ic_launcher_foreground.xml -->
    <path d="M37 30V42M31 36H43" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M33 60L47 74L75 43" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>