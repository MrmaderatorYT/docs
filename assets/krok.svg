<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="108" height="108" rx="24" ry="24"/>
    </clipPath>
    <linearGradient id="bgKrok" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="50%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>
    <filter id="shadowKrok" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#042F2E" flood-opacity="0.45"/>
    </filter>
  </defs>
  <g clip-path="url(#squircle)">
    <rect width="108" height="108" fill="url(#bgKrok)"/>
    
    <!-- Medical pulse waveform background -->
    <path d="M0 64L28 64L35 48L42 78L50 56L56 68L64 64L108 64" fill="none" stroke="#5EEAD4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.3"/>

    <!-- Central Exam & Medical Shield / Cross -->
    <g filter="url(#shadowKrok)">
      <!-- Medical Cross Base -->
      <rect x="44" y="24" width="20" height="60" rx="4" fill="#FFFFFF"/>
      <rect x="24" y="44" width="60" height="20" rx="4" fill="#FFFFFF"/>
      
      <!-- Inner emblem: Examination Checklist Checkmark -->
      <circle cx="54" cy="54" r="16" fill="#0D9488"/>
      <!-- Golden / White Checkmark -->
      <path d="M46 54L52 60L63 47" fill="none" stroke="#FDE047" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>