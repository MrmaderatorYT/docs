<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600">
  <defs>
    <!-- Background and Ambient Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#282422"/>
      <stop offset="45%" stop-color="#181615"/>
      <stop offset="100%" stop-color="#0A0909"/>
    </radialGradient>
    <radialGradient id="goldAmbient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9A96A" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#C9A96A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redSpot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C2564F" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C2564F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenSpot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7FA86B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7FA86B" stop-opacity="0"/>
    </radialGradient>

    <!-- Meter Fill Gradients (Authentic vertical filling inside icons) -->
    <!-- Health 60% fill -->
    <linearGradient id="meterFillHealth" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="62%" stop-color="#C2564F"/>
      <stop offset="62%" stop-color="#FFFFFF" stop-opacity="0.25"/>
    </linearGradient>
    <!-- Influence 50% fill -->
    <linearGradient id="meterFillInfluence" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="50%" stop-color="#7C9ACC"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.25"/>
    </linearGradient>
    <!-- Wealth 70% fill -->
    <linearGradient id="meterFillWealth" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="68%" stop-color="#C6A155"/>
      <stop offset="68%" stop-color="#FFFFFF" stop-opacity="0.25"/>
    </linearGradient>
    <!-- Security 45% fill -->
    <linearGradient id="meterFillSecurity" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="48%" stop-color="#7FA86B"/>
      <stop offset="48%" stop-color="#FFFFFF" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2F2B29"/>
      <stop offset="100%" stop-color="#1D1B1A"/>
    </linearGradient>
    <linearGradient id="sideCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#262322"/>
      <stop offset="100%" stop-color="#171515"/>
    </linearGradient>
    <linearGradient id="goldTitleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="35%" stop-color="#EED49F"/>
      <stop offset="100%" stop-color="#C9A96A"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="heroShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="32" stdDeviation="36" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    <filter id="sideShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="buttonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .badge-text { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 15px; fill: #C9A96A; letter-spacing: 3.5px; text-anchor: middle; }
    .hero-title { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 900; font-size: 92px; fill: url(#goldTitleGrad); letter-spacing: 22px; text-anchor: middle; }
    .tagline1 { font-family: 'Georgia', serif; font-size: 28px; fill: #C9A96A; text-anchor: middle; }
    .tagline2 { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 21px; fill: #A39C93; text-anchor: middle; }
    .card-h { font-family: 'Georgia', serif; font-weight: bold; font-size: 24px; fill: #EFEBE4; text-anchor: middle; }
    .card-q { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 17px; fill: #A39C93; text-anchor: middle; }
    .side-card-h { font-family: 'Georgia', serif; font-weight: bold; font-size: 20px; fill: #C5BFB6; text-anchor: middle; }
    .side-card-q { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 15px; fill: #7E776F; text-anchor: middle; }
    .swipe-text { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 19px; fill: #FFFFFF; text-anchor: middle; }
    .pill-label { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 19px; fill: #EFEBE4; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="1600" fill="url(#bgGlow)" />

  <!-- Ambient Light Halos -->
  <circle cx="600" cy="540" r="500" fill="url(#goldAmbient)" />
  <circle cx="280" cy="580" r="340" fill="url(#redSpot)" />
  <circle cx="920" cy="580" r="340" fill="url(#greenSpot)" />

  <!-- Golden Orbit Rings -->
  <circle cx="600" cy="530" r="380" fill="none" stroke="#C9A96A" stroke-width="1.5" stroke-opacity="0.22" />
  <circle cx="600" cy="530" r="410" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" stroke-dasharray="6,12" />

  <!-- CATEGORY BADGE -->
  <g transform="translate(600, 95)">
    <rect x="-200" y="0" width="400" height="40" rx="20" fill="#C9A96A" fill-opacity="0.15" stroke="#C9A96A" stroke-width="1.5" stroke-opacity="0.45"/>
    <text x="0" y="25" class="badge-text">MINIMALIST CARD DECISION STRATEGY</text>
  </g>

  <!-- 3-CARD COMPOSITION -->
  
  <!-- LEFT CARD: General (Tilted -8deg) -->
  <g transform="translate(130, 230) rotate(-8, 175, 275)" filter="url(#sideShadow)">
    <rect width="350" height="510" rx="26" fill="url(#sideCardGrad)" stroke="#7FA86B" stroke-width="2" stroke-opacity="0.4"/>
    <!-- Art from art_general.xml -->
    <g transform="translate(35, 30) scale(1.16)">
      <clipPath id="genClip"><rect width="240" height="240" rx="16"/></clipPath>
      <g clip-path="url(#genClip)">
        <path fill="#2B3A2E" d="M0,0 H240 V240 H0 Z"/><path fill="#8FB392" d="M120,40 A48,52 0 1,0 120.01,40 Z"/><path fill="#D8B994" d="M82,106 A10,11 0 1,0 82.01,106 Z"/><path fill="#D8B994" d="M158,106 A10,11 0 1,0 158.01,106 Z"/><path fill="#D8B994" d="M105,146 H135 V184 H105 Z"/><path fill="#E8CBA8" d="M120,70 A38,44 0 1,0 120.01,70 Z"/><path fill="#8FB392" d="M120,40 C148,40 168,62 168,92 H72 C72,62 92,40 120,40 Z"/><path fill="#39443A" d="M34,240 C38,190 73,164 120,164 C167,164 202,190 206,240 Z"/><path fill="#7CA080" d="M72,88 H168 V102 H72 Z"/><path fill="#C2564F" d="M110,14 C130,14 134,28 132,44 H110 C106,28 106,14 110,14 Z"/><path fill="#7CA080" d="M96,176 L120,196 L144,176 L144,164 H96 Z"/>
      </g>
    </g>
    <text x="140" y="360" class="side-card-h">Field Marshal</text>
    <text x="140" y="405" class="side-card-q">“Forces await command!”</text>
  </g>

  <!-- RIGHT CARD: Treasurer (Tilted +8deg) -->
  <g transform="translate(720, 230) rotate(8, 175, 275)" filter="url(#sideShadow)">
    <rect width="350" height="510" rx="26" fill="url(#sideCardGrad)" stroke="#C6A155" stroke-width="2" stroke-opacity="0.4"/>
    <!-- Art from art_treasurer.xml -->
    <g transform="translate(35, 30) scale(1.16)">
      <clipPath id="treClip"><rect width="240" height="240" rx="16"/></clipPath>
      <g clip-path="url(#treClip)">
        <path fill="#3A3327" d="M0,0 H240 V240 H0 Z"/><path fill="#B6ADA0" d="M120,46 A44,50 0 1,0 120.01,46 Z"/><path fill="#D8B994" d="M82,106 A10,11 0 1,0 82.01,106 Z"/><path fill="#D8B994" d="M158,106 A10,11 0 1,0 158.01,106 Z"/><path fill="#D8B994" d="M105,146 H135 V184 H105 Z"/><path fill="#E8CBA8" d="M120,70 A38,44 0 1,0 120.01,70 Z"/><path fill="#2E2A23" d="M34,240 C38,190 73,164 120,164 C167,164 202,190 206,240 Z"/><path fill="#2B2A2E" d="M70,88 C70,58 92,38 120,38 C148,38 170,58 170,88 Z"/><path fill="#C6A155" d="M66,84 H174 V98 H66 Z"/><path fill="#C6A155" d="M100,172 C106,196 114,208 120,208 C126,208 134,196 140,172 L132,168 C127,188 124,198 120,198 C116,198 113,188 108,168 Z"/><path fill="#C6A155" d="M120,206 A12,12 0 1,0 120.01,206 Z"/>
      </g>
    </g>
    <text x="210" y="360" class="side-card-h">Royal Treasurer</text>
    <text x="210" y="405" class="side-card-q">“Trade brings steady gold.”</text>
  </g>

  <!-- CENTER HERO CARD: Grand Chancellor (Advisor) -->
  <g transform="translate(370, 175)" filter="url(#heroShadow)">
    <!-- Card Frame -->
    <rect width="460" height="650" rx="30" fill="url(#cardGrad)" stroke="#C9A96A" stroke-width="2.5" stroke-opacity="0.6"/>

    <!-- AUTHENTIC RESOURCE METERS (Color fills inside the icons, no circles) -->
    <!-- Health (Heart) filled with #C2564F -->
    <g transform="translate(44, 25) scale(1.75)">
      <path fill="url(#meterFillHealth)" d="M12,21 C12,21 3,14.4 3,8.9 C3,5.9 5.4,3.6 8.4,3.6 C10.1,3.6 11.4,4.5 12,5.7 C12.6,4.5 13.9,3.6 15.6,3.6 C18.6,3.6 21,5.9 21,8.9 C21,14.4 12,21 12,21 Z"/>
    </g>

    <!-- Influence (Crown) filled with #7C9ACC -->
    <g transform="translate(158, 25) scale(1.75)">
      <path fill="url(#meterFillInfluence)" d="M2.4,6.6 L7.2,11.4 L12,3.4 L16.8,11.4 L21.6,6.6 L19.4,20.6 H4.6 Z"/>
    </g>

    <!-- Wealth (Coin) filled with #C6A155 -->
    <g transform="translate(272, 25) scale(1.75)">
      <path fill="url(#meterFillWealth)" d="M9.6,2.4 H14.4 L13.2,5.8 C17.4,7.2 20.2,10.6 20.2,14.4 C20.2,18.4 16.5,21.6 12,21.6 C7.5,21.6 3.8,18.4 3.8,14.4 C3.8,10.6 6.6,7.2 10.8,5.8 Z"/>
    </g>

    <!-- Security (Shield) filled with #7FA86B -->
    <g transform="translate(386, 25) scale(1.75)">
      <path fill="url(#meterFillSecurity)" d="M12,2.2 L20.4,5.4 V11.6 C20.4,16.7 16.9,20.8 12,22.4 C7.1,20.8 3.6,16.7 3.6,11.6 V5.4 Z"/>
    </g>

    <!-- Advisor Art from art_advisor.xml -->
    <g transform="translate(50, 92) scale(1.5)">
      <clipPath id="advClip"><rect width="240" height="240" rx="16"/></clipPath>
      <g clip-path="url(#advClip)">
        <path fill="#3A3040" d="M0,0 H240 V240 H0 Z"/><path fill="#302E3C" d="M120,36 A54,60 0 1,0 120.01,36 Z"/><path fill="#D8B994" d="M82,106 A10,11 0 1,0 82.01,106 Z"/><path fill="#D8B994" d="M158,106 A10,11 0 1,0 158.01,106 Z"/><path fill="#D8B994" d="M105,146 H135 V184 H105 Z"/><path fill="#E8CBA8" d="M120,70 A38,44 0 1,0 120.01,70 Z"/><path fill="#302E3C" d="M120,36 C154,36 174,64 174,100 C168,84 150,74 120,74 C90,74 72,84 66,100 C66,64 86,36 120,36 Z"/><path fill="#2A2833" d="M34,240 C38,190 73,164 120,164 C167,164 202,190 206,240 Z"/><path fill="#8FBFA6" d="M96,170 L120,206 L144,170 L134,164 L120,186 L106,164 Z"/>
      </g>
    </g>

    <!-- Card Description & Dialog -->
    <text x="230" y="495" class="card-h">Grand Chancellor</text>
    <text x="230" y="542" class="card-q">“The treasury needs urgent taxes</text>
    <text x="230" y="570" class="card-q">to fortify the royal garrison!”</text>
  </g>

  <!-- DECISION SWIPE BADGES -->
  <!-- Left Button (Reject / Red) -->
  <g transform="translate(235, 490)" filter="url(#buttonShadow)">
    <rect width="180" height="60" rx="30" fill="#C2564F" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2"/>
    <text x="90" y="37" class="swipe-text">← Reject</text>
  </g>

  <!-- Right Button (Approve / Green) -->
  <g transform="translate(785, 490)" filter="url(#buttonShadow)">
    <rect width="180" height="60" rx="30" fill="#7FA86B" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2"/>
    <text x="90" y="37" class="swipe-text">Approve →</text>
  </g>

  <!-- MAIN TYPOGRAPHY -->
  <g transform="translate(600, 1030)">
    <text x="11" y="0" class="hero-title">LOOPING</text>
    <text x="0" y="70" class="tagline1">Rule the realm. Balance the 4 vital pillars.</text>
    <text x="0" y="112" class="tagline2">Every card swipe shapes the destiny of your dynasty.</text>
  </g>

  <!-- FEATURE PILL BADGES -->
  <g transform="translate(600, 1280)">
    <g transform="translate(-480, 0)">
      <g transform="translate(0, 0)">
        <rect width="220" height="56" rx="28" fill="#242120" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5"/>
        <circle cx="32" cy="28" r="7.5" fill="#C2564F"/>
        <text x="54" y="35" class="pill-label">100+ Events</text>
      </g>
      <g transform="translate(250, 0)">
        <rect width="220" height="56" rx="28" fill="#242120" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5"/>
        <circle cx="32" cy="28" r="7.5" fill="#7C9ACC"/>
        <text x="54" y="35" class="pill-label">4 Vital Meters</text>
      </g>
      <g transform="translate(500, 0)">
        <rect width="220" height="56" rx="28" fill="#242120" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5"/>
        <circle cx="32" cy="28" r="7.5" fill="#C6A155"/>
        <text x="54" y="35" class="pill-label">100% Offline</text>
      </g>
      <g transform="translate(750, 0)">
        <rect width="210" height="56" rx="28" fill="#242120" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5"/>
        <circle cx="32" cy="28" r="7.5" fill="#7FA86B"/>
        <text x="54" y="35" class="pill-label">Zero Ads</text>
      </g>
    </g>
  </g>
</svg>