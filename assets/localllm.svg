<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 108 108">
  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="108" height="108" rx="24" ry="24"/>
    </clipPath>
    <!-- Authentic background linear gradient from LocalLLM ic_launcher_background.xml -->
    <linearGradient id="llmBgGrad" x1="16" y1="8" x2="92" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B2BD6"/>
      <stop offset="0.55" stop-color="#3E1C9E"/>
      <stop offset="1" stop-color="#23105E"/>
    </linearGradient>
    <!-- Radial highlight from LocalLLM ic_launcher_background.xml -->
    <radialGradient id="llmRadialGrad" cx="42" cy="36" r="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- Violet background with light reflection -->
    <rect width="108" height="108" fill="url(#llmBgGrad)"/>
    <rect width="108" height="108" fill="url(#llmRadialGrad)"/>

    <!-- Authentic foreground from LocalLLM ic_launcher_foreground.xml -->
    <!-- Speech bubble -->
    <path d="M40 26h28a12 12 0 0 1 12 12v16a12 12 0 0 1 -12 12h-24l-12 12l6 -12h-2a12 12 0 0 1 -12 -12v-16a12 12 0 0 1 12 -12z" fill="#FFF7F4FF"/>

    <!-- Pins, drawn before the body so their ends tuck under it -->
    <path d="M40 40.5h6M40 46h6M40 51.5h6M62 40.5h6M62 46h6M62 51.5h6M48.5 32v6M54 32v6M59.5 32v6M48.5 54v6M54 54v6M59.5 54v6" fill="none" stroke="#5B2BD6" stroke-width="3" stroke-linecap="round"/>

    <!-- Processor chip body -->
    <path d="M49 36h10a5 5 0 0 1 5 5v10a5 5 0 0 1 -5 5h-10a5 5 0 0 1 -5 -5v-10a5 5 0 0 1 5 -5z" fill="#5B2BD6"/>

    <!-- Orientation dot -->
    <path d="M49.4 39.6a2.1 2.1 0 1 0 0 4.2a2.1 2.1 0 1 0 0 -4.2z" fill="#FFF7F4FF"/>
  </g>
</svg>