<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="108" height="108" rx="24" ry="24"/>
    </clipPath>
    <linearGradient id="bgVoxel" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E232E"/>
      <stop offset="100%" stop-color="#0E1117"/>
    </linearGradient>
    <linearGradient id="laserGrad" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FF3300"/>
    </linearGradient>
    <linearGradient id="cubeTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8A3D"/>
      <stop offset="100%" stop-color="#FF5722"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E64A19"/>
      <stop offset="100%" stop-color="#BF360C"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D84315"/>
      <stop offset="100%" stop-color="#870000"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <g clip-path="url(#squircle)">
    <rect width="108" height="108" fill="url(#bgVoxel)"/>
    
    <!-- Subtle voxel grid -->
    <path d="M0 36H108M0 72H108M36 0V108M72 0V108" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    
    <!-- Isometric 3D Center Voxel Cube -->
    <g transform="translate(54, 52)">
      <!-- Top Face -->
      <polygon points="0,-22 22,-10 0,2 -22,-10" fill="url(#cubeTop)"/>
      <!-- Left Face -->
      <polygon points="-22,-10 0,2 0,26 -22,14" fill="url(#cubeLeft)"/>
      <!-- Right Face -->
      <polygon points="0,2 22,-10 22,14 0,26" fill="url(#cubeRight)"/>
      
      <!-- Cube edge highlights -->
      <polygon points="0,-22 22,-10 0,2 -22,-10" fill="none" stroke="#FFCC80" stroke-width="0.8" stroke-opacity="0.6"/>
      <line x1="0" y1="2" x2="0" y2="26" stroke="#FFA726" stroke-width="0.8" stroke-opacity="0.6"/>
    </g>

    <!-- Crosshair HUD Elements -->
    <g filter="url(#glow)">
      <!-- Outer Reticle Ring -->
      <circle cx="54" cy="54" r="38" fill="none" stroke="#FF5722" stroke-width="1.8" stroke-dasharray="8 6" stroke-opacity="0.85"/>
      <!-- Inner Precision Ring -->
      <circle cx="54" cy="54" r="16" fill="none" stroke="#FF9800" stroke-width="1.2" stroke-opacity="0.9"/>
      <!-- Targeting Ticks -->
      <line x1="54" y1="10" x2="54" y2="20" stroke="#FF5722" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="54" y1="88" x2="54" y2="98" stroke="#FF5722" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="10" y1="54" x2="20" y2="54" stroke="#FF5722" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="88" y1="54" x2="98" y2="54" stroke="#FF5722" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Center Laser Dot -->
      <circle cx="54" cy="54" r="2.5" fill="#FFF3E0"/>
    </g>
  </g>
</svg>