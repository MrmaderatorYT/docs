    <g filter="url(#shadowMaple)">
      <path fill="#FFFFFF" d="M54,24 L59.5,37 L68,33 L66,47.5 L78,43 L73.5,55 L82,59 L67,69 L69,75 L56.5,73 L56.5,86 L51.5,86 L51.5,73 L39,75 L41,69 L26,59 L34.5,55 L30,43 L42,47.5 L40,33 L48.5,37 Z"/>
    </g>
  </g>
</svg>
