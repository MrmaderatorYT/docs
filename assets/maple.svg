<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <defs>
    <clipPath id="squircleMaple">
      <rect x="0" y="0" width="108" height="108" rx="24" ry="24"/>
    </clipPath>
    <linearGradient id="bgMaple" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="60%" stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
    <filter id="shadowMaple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#450A0A" flood-opacity="0.5"/>
    </filter>
  </defs>
  <g clip-path="url(#squircleMaple)">
    <rect width="108" height="108" fill="url(#bgMaple)"/>
    <!-- VM / CPU Virtualization Ring -->
    <circle cx="54" cy="54" r="38" fill="none" stroke="#FCA5A5" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="4 3"/>
    <circle cx="54" cy="54" r="44" fill="none" stroke="#FCA5A5" stroke-width="1" stroke-opacity="0.2"/>

