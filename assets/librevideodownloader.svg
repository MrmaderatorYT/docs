<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="108" height="108" rx="24" ry="24"/>
    </clipPath>
    <linearGradient id="bgDownloader" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="50%" stop-color="#BE123C"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <filter id="shadowDL" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="3.5" flood-color="#4C0519" flood-opacity="0.5"/>
    </filter>
  </defs>
  <g clip-path="url(#squircle)">
    <rect width="108" height="108" fill="url(#bgDownloader)"/>
    
    <!-- Concentric Media Wave Rings -->
    <circle cx="54" cy="54" r="38" fill="none" stroke="#FDA4AF" stroke-width="1.2" stroke-dasharray="4 4" stroke-opacity="0.4"/>
    <circle cx="54" cy="54" r="28" fill="none" stroke="#FECDD3" stroke-width="1.5" stroke-opacity="0.3"/>

    <!-- Central Download Arrow + Media Play Shield -->
    <g filter="url(#shadowDL)">
      <!-- Bottom Tray (Download destination base) -->
      <path d="M30 76H78C80.2 76 82 77.8 82 80C82 82.2 80.2 84 78 84H30C27.8 84 26 82.2 26 80C26 77.8 27.8 76 30 76Z" fill="#FFFFFF"/>
      <path d="M26 70V80M82 70V80" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

      <!-- Downward Arrow with embedded Play Triangle -->
      <path d="M54 22V62" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
      <path d="M38 50L54 66L70 50" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Video Play Symbol (small subtle accent) -->
      <polygon points="50,32 60,38 50,44" fill="#E11D48"/>
    </g>
  </g>
</svg>