<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="108" height="108" rx="24" ry="24"/>
    </clipPath>
    <linearGradient id="topGrad" x1="34" y1="44" x2="74" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="100%" stop-color="#81D4FA"/>
    </linearGradient>
    <linearGradient id="leftGrad" x1="34" y1="44" x2="54" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E88E5"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <linearGradient id="rightGrad" x1="54" y1="44" x2="74" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- Background -->
    <rect width="108" height="108" fill="#0C1219" />

    <!-- Grid lines -->
    <path d="M0,18L108,18 M0,36L108,36 M0,54L108,54 M0,72L108,72 M0,90L108,90" stroke="#1A3A5C" stroke-width="0.6" fill="none" opacity="0.8"/>
    <path d="M18,0L18,108 M36,0L36,108 M54,0L54,108 M72,0L72,108 M90,0L90,108" stroke="#1A3A5C" stroke-width="0.6" fill="none" opacity="0.8"/>

    <!-- Subtle radial glow behind voxel -->
    <circle cx="54" cy="54" r="32" fill="#1E88E5" opacity="0.12" filter="blur(8px)"/>

    <!-- Main Voxel Cube with shadow -->
    <g filter="url(#shadow)">
      <!-- Left face -->
      <path fill="#1E88E5" d="M34,44 L54,56 L54,76 L34,64 Z" />
      <!-- Right face -->
      <path fill="#1565C0" d="M54,56 L74,44 L74,64 L54,76 Z" />
      <!-- Top face -->
      <path fill="#4FC3F7" d="M54,32 L74,44 L54,56 L34,44 Z" />

      <!-- Top face grid lines -->
      <path stroke="#81D4FA" stroke-width="0.6" fill="none" d="M44,38 L64,50" />
      <path stroke="#81D4FA" stroke-width="0.6" fill="none" d="M44,44 L54,50 M54,50 L64,44" />

      <!-- Left face grid lines -->
      <path stroke="#42A5F5" stroke-width="0.6" fill="none" d="M34,50 L54,62" />
      <path stroke="#42A5F5" stroke-width="0.6" fill="none" d="M44,56 L44,64" />

      <!-- Right face grid lines -->
      <path stroke="#1976D2" stroke-width="0.6" fill="none" d="M54,62 L74,50" />
      <path stroke="#1976D2" stroke-width="0.6" fill="none" d="M64,56 L64,64" />

      <!-- Small floating accent gold voxel -->
      <g>
        <path fill="#FFCA28" d="M54,26 L60,29 L54,32 L48,29 Z" />
        <path fill="#F9A825" d="M48,29 L54,32 L54,38 L48,35 Z" />
        <path fill="#F57F17" d="M54,32 L60,29 L60,35 L54,38 Z" />
      </g>
    </g>
  </g>
</svg>
