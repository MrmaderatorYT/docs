<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#24211F"/>
      <stop offset="50%" stop-color="#161413"/>
      <stop offset="100%" stop-color="#0C0B0A"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9A96A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C9A96A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C2564F" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C2564F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7FA86B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7FA86B" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Gradients & Shadows -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2E2B29"/>
      <stop offset="100%" stop-color="#1E1C1B"/>
    </linearGradient>
    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="40%" stop-color="#F3DCAC"/>
      <stop offset="100%" stop-color="#C9A96A"/>
    </linearGradient>
    
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="36" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    .title { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 84px; fill: url(#goldTextGrad); letter-spacing: 16px; }
    .badge-text { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: bold; font-size: 15px; fill: #C9A96A; letter-spacing: 3px; }
    .tagline1 { font-family: 'Georgia', serif; font-size: 26px; fill: #C9A96A; }
    .tagline2 { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 20px; fill: #A39C93; }
    .card-title { font-family: 'Georgia', serif; font-weight: bold; font-size: 26px; fill: #EFEBE4; text-anchor: middle; }
    .card-quote { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 18px; fill: #A39C93; text-anchor: middle; }
    .swipe-btn { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: bold; font-size: 19px; fill: #FFFFFF; text-anchor: middle; }
    .pill-text { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: bold; font-size: 18px; fill: #EFEBE4; }
    .brand-logo { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 15px; fill: #8A8177; letter-spacing: 5px; }
  </style>

  <!-- Background -->
  <rect width="1200" height="1600" fill="url(#bgGrad)" />

  <!-- Ambient Lights -->
  <circle cx="600" cy="560" r="440" fill="url(#goldGlow)" />
  <circle cx="320" cy="620" r="280" fill="url(#redGlow)" />
  <circle cx="880" cy="620" r="280" fill="url(#greenGlow)" />

  <!-- Decorative Orbit Ring (Behind Card) -->
  <circle cx="600" cy="560" r="380" fill="none" stroke="#C9A96A" stroke-width="1.5" stroke-opacity="0.2" />
  <circle cx="600" cy="560" r="405" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" stroke-dasharray="6,10" />

  <!-- TOP HEADER -->
  <g transform="translate(600, 85)" text-anchor="middle">
    <!-- Studio Logo Mark -->
    <g transform="translate(-16, -5) scale(0.6)">
      <path d="M51,21 A33,33 0 0,0 51,87 L51,77 A23,23 0 0,1 51,31 Z" fill="#C2564F"/>
      <path d="M57,21 A33,33 0 0,1 57,87 L57,77 A23,23 0 0,0 57,31 Z" fill="#7FA86B"/>
      <polygon points="38,66 38,51 46.3,59.4 54,46.2 61.7,59.4 70,51 70,66" fill="#EFEBE4"/>
    </g>
    <text x="32" y="40" class="brand-logo">CYBERCRAFT STUDIO</text>
  </g>

  <!-- CATEGORY BADGE -->
  <g transform="translate(600, 150)">
    <rect x="-195" y="0" width="390" height="40" rx="20" fill="#C9A96A" fill-opacity="0.15" stroke="#C9A96A" stroke-width="1.5" stroke-opacity="0.45"/>
    <text x="0" y="25" text-anchor="middle" class="badge-text">КАРТКОВА СТРАТЕГІЯ РІШЕНЬ</text>
  </g>

  <!-- ------------------------------------------------------------- -->
  <!-- CENTER GAMEPLAY CARD -->
  <!-- ------------------------------------------------------------- -->
  <g transform="translate(360, 230)" filter="url(#dropShadow)">
    <!-- Card Frame -->
    <rect width="480" height="660" rx="32" fill="url(#cardGrad)" stroke="#C9A96A" stroke-width="2.5" stroke-opacity="0.55"/>

    <!-- 4 RESOURCE METERS AT TOP OF CARD -->
    <!-- Health meter (Red) -->
    <g transform="translate(60, 48)">
      <circle cx="0" cy="0" r="22" fill="#232120" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2"/>
      <path d="M0,-22 A22,22 0 1,1 -15.5,15.5 L0,0 Z" fill="#C2564F"/>
      <circle cx="0" cy="0" r="9" fill="#1F1D1C"/>
      <g transform="translate(-10, -10) scale(0.85)">
        <path d="M12,21 C12,21 3,14.4 3,8.9 C3,5.9 5.4,3.6 8.4,3.6 C10.1,3.6 11.4,4.5 12,5.7 C12.6,4.5 13.9,3.6 15.6,3.6 C18.6,3.6 21,5.9 21,8.9 C21,14.4 12,21 12,21 Z" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- Influence meter (Blue) -->
    <g transform="translate(180, 48)">
      <circle cx="0" cy="0" r="22" fill="#232120" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2"/>
      <path d="M0,-22 A22,22 0 1,1 -22,0 L0,0 Z" fill="#7C9ACC"/>
      <circle cx="0" cy="0" r="9" fill="#1F1D1C"/>
      <g transform="translate(-10, -10) scale(0.85)">
        <path d="M2.4,6.6 L7.2,11.4 L12,3.4 L16.8,11.4 L21.6,6.6 L19.4,20.6 H4.6 Z" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- Wealth meter (Gold) -->
    <g transform="translate(300, 48)">
      <circle cx="0" cy="0" r="22" fill="#232120" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2"/>
      <path d="M0,-22 A22,22 0 0,1 22,0 L0,0 Z" fill="#C6A155"/>
      <circle cx="0" cy="0" r="9" fill="#1F1D1C"/>
      <g transform="translate(-10, -10) scale(0.85)">
        <path d="M9.6,2.4 H14.4 L13.2,5.8 C17.4,7.2 20.2,10.6 20.2,14.4 C20.2,18.4 16.5,21.6 12,21.6 C7.5,21.6 3.8,18.4 3.8,14.4 C3.8,10.6 6.6,7.2 10.8,5.8 Z" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- Security meter (Green) -->
    <g transform="translate(420, 48)">
      <circle cx="0" cy="0" r="22" fill="#232120" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2"/>
      <path d="M0,-22 A22,22 0 1,1 0,22 L0,0 Z" fill="#7FA86B"/>
      <circle cx="0" cy="0" r="9" fill="#1F1D1C"/>
      <g transform="translate(-10, -10) scale(0.85)">
        <path d="M12,2.2 L20.4,5.4 V11.6 C20.4,16.7 16.9,20.8 12,22.4 C7.1,20.8 3.6,16.7 3.6,11.6 V5.4 Z" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- Character Illustration Canvas -->
    <g transform="translate(40, 95)">
      <rect width="400" height="320" rx="20" fill="#3A3040" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5"/>
      <!-- Grand Chancellor Avatar Silhouette -->
      <g transform="translate(80, 40) scale(1.0)">
        <circle cx="120" cy="80" r="62" fill="#302E3C"/>
        <ellipse cx="82" cy="115" rx="10" ry="11" fill="#D8B994"/>
        <ellipse cx="158" cy="115" rx="10" ry="11" fill="#D8B994"/>
        <rect x="105" y="150" width="30" height="38" fill="#D8B994"/>
        <ellipse cx="120" cy="85" rx="42" ry="48" fill="#E8CBA8"/>
        <path d="M120,40 C154,40 174,68 174,104 C168,88 150,78 120,78 C90,78 72,88 66,104 C66,68 86,40 120,40 Z" fill="#302E3C"/>
        <path d="M34,244 C38,194 73,168 120,168 C167,168 202,194 206,244 Z" fill="#2A2833"/>
        <polygon points="96,174 120,210 144,174 134,168 120,190 106,168" fill="#8FBFA6"/>
        <!-- Golden Crown on Head -->
        <polygon points="95,44 105,24 120,38 135,24 145,44" fill="#C9A96A"/>
      </g>
    </g>

    <!-- Card Description & Dialog -->
    <text x="240" y="465" class="card-title">Головний Радник</text>
    <text x="240" y="515" class="card-quote">«Скарбниця потребує нових податків,</text>
    <text x="240" y="542" class="card-quote">щоб утримати форпости!»</text>
  </g>

  <!-- FLOATING DECISION BUTTONS (Swipe Left & Right) -->
  <!-- Left Button (Reject / Red) -->
  <g transform="translate(230, 530)" filter="url(#softShadow)">
    <rect width="180" height="60" rx="30" fill="#C2564F" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>
    <text x="90" y="38" class="swipe-btn">← Відмовити</text>
  </g>

  <!-- Right Button (Approve / Green) -->
  <g transform="translate(790, 530)" filter="url(#softShadow)">
    <rect width="180" height="60" rx="30" fill="#7FA86B" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>
    <text x="90" y="38" class="swipe-btn">Прийняти →</text>
  </g>

  <!-- ------------------------------------------------------------- -->
  <!-- TYPOGRAPHY & HERO SECTION -->
  <!-- ------------------------------------------------------------- -->
  <g transform="translate(600, 1000)" text-anchor="middle">
    <!-- Big Title -->
    <text x="8" y="0" class="title">LOOPING</text>

    <!-- Taglines -->
    <text x="0" y="65" class="tagline1">Керуй королівством. Тримай баланс 4 ресурсів.</text>
    <text x="0" y="102" class="tagline2">Кожен свайп вирішує долю твоєї імперії.</text>
  </g>

  <!-- ------------------------------------------------------------- -->
  <!-- BOTTOM PILL BADGES (Key Features) -->
  <!-- ------------------------------------------------------------- -->
  <g transform="translate(600, 1220)">
    <g transform="translate(-460, 0)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="210" height="52" rx="26" fill="#242120" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>
        <circle cx="30" cy="26" r="7" fill="#C2564F"/>
        <text x="50" y="33" class="pill-text">100+ Подій</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(240, 0)">
        <rect width="210" height="52" rx="26" fill="#242120" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>
        <circle cx="30" cy="26" r="7" fill="#7C9ACC"/>
        <text x="50" y="33" class="pill-text">4 Ресурси</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(480, 0)">
        <rect width="210" height="52" rx="26" fill="#242120" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>
        <circle cx="30" cy="26" r="7" fill="#C6A155"/>
        <text x="50" y="33" class="pill-text">100% Офлайн</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(720, 0)">
        <rect width="200" height="52" rx="26" fill="#242120" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>
        <circle cx="30" cy="26" r="7" fill="#7FA86B"/>
        <text x="50" y="33" class="pill-text">Без реклами</text>
      </g>
    </g>
  </g>

  <!-- BOTTOM FOOTER -->
  <g transform="translate(600, 1430)" text-anchor="middle">
    <!-- Divider Line -->
    <line x1="-300" y1="0" x2="300" y2="0" stroke="#C9A96A" stroke-opacity="0.25" stroke-width="1.5" />
    <text x="0" y="45" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#7E766D" letter-spacing="1.5px">
      FREE &amp; OPEN SOURCE • ANDROID 8.0+ • ZERO-KNOWLEDGE BALANCE
    </text>
  </g>
</svg>