<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="108" height="108" rx="24" ry="24"/>
    </clipPath>
    <linearGradient id="bgChess" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="50%" stop-color="#1C1917"/>
      <stop offset="100%" stop-color="#0C0A09"/>
    </linearGradient>
    <linearGradient id="goldKnight" x1="30" y1="20" x2="80" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="30%" stop-color="#FACC15"/>
      <stop offset="70%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </linearGradient>
    <filter id="shadowChess" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <g clip-path="url(#squircle)">
    <rect width="108" height="108" fill="url(#bgChess)"/>
    
    <!-- Stylized chessboard checks in corners -->
    <rect x="12" y="12" width="16" height="16" fill="#44403C" opacity="0.4"/>
    <rect x="28" y="28" width="16" height="16" fill="#44403C" opacity="0.4"/>
    <rect x="80" y="80" width="16" height="16" fill="#44403C" opacity="0.4"/>
    <rect x="64" y="64" width="16" height="16" fill="#44403C" opacity="0.4"/>

    <!-- Majestic Chess Knight Silhouette -->
    <g filter="url(#shadowChess)">
      <!-- Base pedestal -->
      <path d="M30 84C30 81 34 80 40 80H68C74 80 78 81 78 84H30Z" fill="url(#goldKnight)"/>
      <rect x="34" y="76" width="40" height="4" rx="1.5" fill="url(#goldKnight)"/>

      <!-- Knight Body & Head -->
      <path d="M40 76C40 68 36 62 33 54C30 46 32 38 38 32C44 26 50 24 55 24C58 24 60 21 62 21C64 21 63 26 66 26C70 26 73 29 74 34C75 40 71 45 67 47C62 49 61 54 66 60C70 65 72 70 72 76H40Z" fill="url(#goldKnight)"/>
      
      <!-- Knight Eye -->
      <circle cx="48" cy="36" r="2.2" fill="#1C1917"/>
      <!-- Mane groove -->
      <path d="M58 29C60 33 60 38 57 42" stroke="#A16207" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      <!-- Muzzle line -->
      <path d="M36 43C39 45 42 44 45 42" stroke="#A16207" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    </g>
  </g>
</svg>