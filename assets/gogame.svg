<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="108" height="108" rx="24" ry="24"/>
    </clipPath>
    <linearGradient id="boardWood" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EED7AE"/>
      <stop offset="50%" stop-color="#E4C898"/>
      <stop offset="100%" stop-color="#D7B580"/>
    </linearGradient>
    <linearGradient id="blackStoneGrad" x1="46" y1="46" x2="62" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3A3A3A"/>
      <stop offset="35%" stop-color="#242424"/>
      <stop offset="100%" stop-color="#0E0E0E"/>
    </linearGradient>
    <radialGradient id="blackHighlight" cx="50" cy="50" r="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#666666" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#333333" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="whiteStoneGrad" x1="68" y1="28" x2="80" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F7F5EF"/>
      <stop offset="100%" stop-color="#D9D5CB"/>
    </linearGradient>
    <linearGradient id="whiteStoneGrad2" x1="28" y1="68" x2="40" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F7F5EF"/>
      <stop offset="100%" stop-color="#D9D5CB"/>
    </linearGradient>
    <filter id="stoneShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="1" dy="2.5" stdDeviation="2.2" flood-color="#543818" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- Board base -->
    <rect width="108" height="108" fill="url(#boardWood)" />

    <!-- Subtle wood grain lines -->
    <path d="M0,25 Q54,28 108,24 M0,50 Q54,47 108,52 M0,85 Q54,88 108,83" stroke="#D3A96A" stroke-width="0.5" fill="none" opacity="0.35"/>

    <!-- Grid lines -->
    <g stroke="#7A5828" stroke-width="1.8" stroke-linecap="square">
      <!-- Horizontal lines -->
      <line x1="24" y1="34" x2="84" y2="34" />
      <line x1="24" y1="54" x2="84" y2="54" />
      <line x1="24" y1="74" x2="84" y2="74" />
      <!-- Vertical lines -->
      <line x1="34" y1="24" x2="34" y2="84" />
      <line x1="54" y1="24" x2="54" y2="84" />
      <line x1="74" y1="24" x2="74" y2="84" />
    </g>

    <!-- Star point / Hoshi (small dots on intersections) -->
    <circle cx="54" cy="54" r="1.8" fill="#7A5828"/>
    <circle cx="34" cy="34" r="1.5" fill="#7A5828"/>
    <circle cx="74" cy="34" r="1.5" fill="#7A5828"/>
    <circle cx="34" cy="74" r="1.5" fill="#7A5828"/>
    <circle cx="74" cy="74" r="1.5" fill="#7A5828"/>

    <!-- Stones with realistic drop shadow and 3D feel -->
    <!-- Top-right White Stone -->
    <g filter="url(#stoneShadow)">
      <circle cx="74" cy="34" r="11" fill="url(#whiteStoneGrad)" stroke="#CBC6B8" stroke-width="0.4"/>
      <ellipse cx="71.5" cy="31.5" rx="4" ry="2.5" fill="#FFFFFF" opacity="0.85" transform="rotate(-20 71.5 31.5)"/>
    </g>

    <!-- Bottom-left White Stone -->
    <g filter="url(#stoneShadow)">
      <circle cx="34" cy="74" r="11" fill="url(#whiteStoneGrad2)" stroke="#CBC6B8" stroke-width="0.4"/>
      <ellipse cx="31.5" cy="71.5" rx="4" ry="2.5" fill="#FFFFFF" opacity="0.85" transform="rotate(-20 31.5 71.5)"/>
    </g>

    <!-- Center Black Stone -->
    <g filter="url(#stoneShadow)">
      <circle cx="54" cy="54" r="12" fill="url(#blackStoneGrad)"/>
      <circle cx="51.5" cy="51.5" r="9" fill="url(#blackHighlight)"/>
      <ellipse cx="50" cy="49" rx="4" ry="2.2" fill="#FFFFFF" opacity="0.22" transform="rotate(-25 50 49)"/>
    </g>
  </g>
</svg>
