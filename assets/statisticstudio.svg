<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 108 108">
  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="108" height="108" rx="24" ry="24"/>
    </clipPath>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#081426"/>
      <stop offset="50%" stop-color="#0F2444"/>
      <stop offset="100%" stop-color="#1B365D"/>
    </linearGradient>
    <linearGradient id="bar1Grad" x1="0" y1="84" x2="0" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="bar2Grad" x1="0" y1="84" x2="0" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="bar3Grad" x1="0" y1="84" x2="0" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="bar4Grad" x1="0" y1="84" x2="0" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="curveGrad" x1="14" y1="50" x2="94" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="curveAreaGrad" x1="0" y1="20" x2="0" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0F2444" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- Deep Navy Gradient Background -->
    <rect width="108" height="108" fill="url(#bgGrad)"/>

    <!-- Subtle Statistical Coordinate Grid -->
    <g stroke="#38BDF8" stroke-width="0.5" opacity="0.12">
      <line x1="14" y1="24" x2="94" y2="24"/>
      <line x1="14" y1="44" x2="94" y2="44"/>
      <line x1="14" y1="64" x2="94" y2="64"/>
      <line x1="14" y1="84" x2="94" y2="84"/>
      <line x1="34" y1="14" x2="34" y2="84"/>
      <line x1="54" y1="14" x2="54" y2="84"/>
      <line x1="74" y1="14" x2="74" y2="84"/>
      <line x1="94" y1="14" x2="94" y2="84"/>
    </g>

    <!-- Base Axis Lines -->
    <line x1="14" y1="84" x2="96" y2="84" stroke="#60A5FA" stroke-width="1.2" opacity="0.5" stroke-linecap="round"/>
    <line x1="14" y1="14" x2="14" y2="84" stroke="#60A5FA" stroke-width="1.2" opacity="0.5" stroke-linecap="round"/>

    <!-- Area Under Gaussian Curve -->
    <path d="M14,84 C28,84 38,76 46,50 C51,32 54,22 57,22 C60,22 63,32 68,50 C76,76 86,84 96,84 Z" fill="url(#curveAreaGrad)"/>

    <!-- Statistical Histogram Bars with Shadows -->
    <g filter="url(#glow)">
      <!-- Bar 1 -->
      <rect x="23" y="60" width="11" height="24" rx="2" fill="url(#bar1Grad)"/>
      <!-- Bar 2 -->
      <rect x="38" y="42" width="11" height="42" rx="2" fill="url(#bar2Grad)"/>
      <!-- Bar 3 (Peak) -->
      <rect x="53" y="28" width="11" height="56" rx="2" fill="url(#bar3Grad)"/>
      <!-- Bar 4 -->
      <rect x="68" y="48" width="11" height="36" rx="2" fill="url(#bar4Grad)"/>
      <!-- Bar 5 -->
      <rect x="83" y="68" width="11" height="16" rx="2" fill="url(#bar1Grad)"/>
    </g>

    <!-- Gaussian Distribution Trend Line -->
    <path d="M14,83 C28,83 38,76 46,50 C51,32 54,22 57,22 C60,22 63,32 68,50 C76,76 86,83 96,83" fill="none" stroke="url(#curveGrad)" stroke-width="2.6" stroke-linecap="round"/>

    <!-- Glowing Scatter / Data Points along distribution -->
    <g>
      <!-- Point 1 -->
      <circle cx="28" cy="74" r="2.2" fill="#38BDF8"/>
      <circle cx="28" cy="74" r="1" fill="#FFFFFF"/>
      <!-- Point 2 -->
      <circle cx="43" cy="48" r="2.2" fill="#60A5FA"/>
      <circle cx="43" cy="48" r="1" fill="#FFFFFF"/>
      <!-- Peak Point -->
      <circle cx="57" cy="22" r="3" fill="#A78BFA"/>
      <circle cx="57" cy="22" r="1.4" fill="#FFFFFF"/>
      <!-- Point 4 -->
      <circle cx="73" cy="54" r="2.2" fill="#2DD4BF"/>
      <circle cx="73" cy="54" r="1" fill="#FFFFFF"/>
      <!-- Point 5 -->
      <circle cx="88" cy="76" r="2.2" fill="#38BDF8"/>
      <circle cx="88" cy="76" r="1" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
