<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="108" height="108" rx="24" ry="24"/>
    </clipPath>
    <linearGradient id="bgDev" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="chevronGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="shadowDev" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#032F4F" flood-opacity="0.5"/>
    </filter>
  </defs>
  <g clip-path="url(#squircle)">
    <rect width="108" height="108" fill="url(#bgDev)"/>
    
    <!-- Code matrix lines -->
    <path d="M22 28H44M22 36H56M22 44H38" stroke="#BAE6FD" stroke-width="2" stroke-linecap="round" stroke-opacity="0.35"/>
    <path d="M68 80H86M54 72H86M62 64H86" stroke="#BAE6FD" stroke-width="2" stroke-linecap="round" stroke-opacity="0.35"/>

    <!-- Central Rising Dev Symbol (Code Brackets + Upward Arrow/Chevron) -->
    <g filter="url(#shadowDev)">
      <!-- Left Bracket < -->
      <path d="M34 44L22 54L34 64" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Right Bracket > -->
      <path d="M74 44L86 54L74 64" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Upward Growth Arrow (Level Up) -->
      <path d="M54 26L38 42H48V72H60V42H70L54 26Z" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>
      
      <!-- Accent star on peak -->
      <circle cx="54" cy="22" r="2.5" fill="#FEF08A"/>
    </g>
  </g>
</svg>