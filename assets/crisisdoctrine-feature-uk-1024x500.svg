<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <!-- Cinematic Deep Background Gradient -->
    <radialGradient id="bgGlow" cx="40%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1A201B"/>
      <stop offset="50%" stop-color="#111512"/>
      <stop offset="100%" stop-color="#080A08"/>
    </radialGradient>
    
    <!-- Atmospheric Halos -->
    <radialGradient id="greenAtmosphere" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4E6B4A" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#4E6B4A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldAtmosphere" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C4A45A" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#C4A45A" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Gold Gradient for Typography -->
    <linearGradient id="goldTitleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF6"/>
      <stop offset="35%" stop-color="#E8D196"/>
      <stop offset="100%" stop-color="#C4A45A"/>
    </linearGradient>

    <!-- Minimalist Card Frame Gradient -->
    <linearGradient id="heroCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242C25"/>
      <stop offset="100%" stop-color="#161A17"/>
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="heroShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    .badge-text { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 11px; fill: #C4A45A; letter-spacing: 2.2px; text-anchor: middle; }
    .hero-title { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 900; font-size: 44px; fill: url(#goldTitleGrad); letter-spacing: 6.5px; }
    .tagline1 { font-family: 'Georgia', serif; font-size: 21px; fill: #C4A45A; }
    .tagline2 { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 15px; fill: #9AA898; }
    .pill-label { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 13.5px; fill: #E8EFE6; }
    .advisor-title { font-family: 'Georgia', serif; font-weight: bold; font-size: 18px; fill: #E8EFE6; text-anchor: middle; }
    .advisor-sub { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 600; font-size: 12px; fill: #8CA08A; letter-spacing: 1.5px; text-anchor: middle; }
  </style>

  <!-- Background Layer -->
  <rect width="1024" height="500" fill="url(#bgGlow)" />

  <!-- Ambient Light Effects -->
  <circle cx="240" cy="250" r="320" fill="url(#greenAtmosphere)" />
  <circle cx="760" cy="220" r="340" fill="url(#goldAtmosphere)" />

  <!-- Minimalist Geometric Tactical Rings -->
  <circle cx="240" cy="250" r="210" fill="none" stroke="#4E6B4A" stroke-width="1.2" stroke-opacity="0.25" stroke-dasharray="4,8" />
  <circle cx="240" cy="250" r="235" fill="none" stroke="#C4A45A" stroke-width="1" stroke-opacity="0.15" />

  <!-- LEFT: ICONIC HERO CARD (px_advisor) -->
  <g transform="translate(95, 65)" filter="url(#heroShadow)">
    <!-- Sleek Tactical Card Frame -->
    <rect width="290" height="370" rx="24" fill="url(#heroCardGrad)" stroke="#4A5E46" stroke-width="2" stroke-opacity="0.7"/>
    <rect x="8" y="8" width="274" height="354" rx="18" fill="none" stroke="#C4A45A" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Hero px_advisor Pixel Art -->
    <g transform="translate(35, 30)">
      <image href="data:image/png;base64," width="220" height="220" style="image-rendering: pixelated;"/>
    </g>

    <!-- Character Caption Plate -->
    <text x="145" y="295" class="advisor-title">Головний Радник</text>
    <text x="145" y="322" class="advisor-sub">Штаб Республіки</text>
  </g>

  <!-- RIGHT: MINIMALIST BRANDING, TYPOGRAPHY AND FEATURES -->
  <g transform="translate(440, 0)">
    <!-- Category Badge -->
    <g transform="translate(0, 75)" filter="url(#badgeShadow)">
      <rect width="330" height="32" rx="16" fill="#C4A45A" fill-opacity="0.12" stroke="#C4A45A" stroke-width="1.2" stroke-opacity="0.45"/>
      <text x="165" y="20" class="badge-text">ПОКРОКОВА ВІЙСЬКОВО-ПОЛІТИЧНА СТРАТЕГІЯ</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 168)">
      <text x="0" y="0" class="hero-title">CRISIS DOCTRINE</text>
    </g>

    <!-- Taglines -->
    <g transform="translate(0, 230)">
      <text x="0" y="0" class="tagline1">Керуй державою під час кризи.</text>
      <text x="0" y="32" class="tagline2">Кожен наказ має ціну. Кожне рішення формує історію.</text>
    </g>

    <!-- 4 Clean Feature Pills in 2x2 Grid -->
    <g transform="translate(0, 320)">
      <!-- Row 1 -->
      <g transform="translate(0, 0)">
        <rect width="240" height="46" rx="23" fill="#1C241E" stroke="#4E6B4A" stroke-opacity="0.3" stroke-width="1.5"/>
        <circle cx="26" cy="23" r="6" fill="#C4A45A"/>
        <text x="44" y="29" class="pill-label">6 Регіонів</text>
      </g>
      <g transform="translate(255, 0)">
        <rect width="250" height="46" rx="23" fill="#1C241E" stroke="#4E6B4A" stroke-opacity="0.3" stroke-width="1.5"/>
        <circle cx="26" cy="23" r="6" fill="#7FA86B"/>
        <text x="44" y="29" class="pill-label">Повстанці &amp; Розвідка</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 60)">
        <rect width="240" height="46" rx="23" fill="#1C241E" stroke="#4E6B4A" stroke-opacity="0.3" stroke-width="1.5"/>
        <circle cx="26" cy="23" r="6" fill="#7C9ACC"/>
        <text x="44" y="29" class="pill-label">100% Офлайн</text>
      </g>
      <g transform="translate(255, 60)">
        <rect width="250" height="46" rx="23" fill="#1C241E" stroke="#4E6B4A" stroke-opacity="0.3" stroke-width="1.5"/>
        <circle cx="26" cy="23" r="6" fill="#C2564F"/>
        <text x="44" y="29" class="pill-label">Без реклами</text>
      </g>
    </g>
  </g>
</svg>