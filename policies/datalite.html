# Політика конфіденційності — DataLite

Додаток **DataLite** — це локальна data-нотатка з Go backend та HTML5 frontend. Усі дані зберігаються локально на вашому пристрої.

## 1. Збір та використання даних

Додаток працює повністю локально на вашому пристрої. Жодні особисті дані, файли проєктів або контент не збираються, не зберігаються та не передаються на сервери розробника.

## 2. Що додаток не робить

- не збирає особисті дані користувачів;
- не використовує аналітику чи рекламні SDK;
- не потребує облікового запису для роботи;
- не продає та не передає дані третім сторонам.

## 3. Зміни до цієї політики

Ми можемо оновлювати цю політику. Актуальна версія буде доступна за тією ж адресою.

## 4. Контакти

Питання щодо політики: [cybercraftstudiopro@gmail.com](mailto:cybercraftstudiopro@gmail.com)

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const md = document.getElementById('mdContent').textContent;
      document.getElementById('policyContent').innerHTML = simpleMd(md);
    });

    function simpleMd(src) {
      return src
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
        .replace(/^# (.+)$/gm, '<h1>$1</h1>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
        .replace(/^- (.+)$/gm, '<li>$1</li>')
        .replace(/(<li>.*<\/li>\n?)+/g, m => '<ul>' + m + '</ul>')
        .replace(/\n\n+/g, '</p><p>')
        .replace(/^(?!<[hulo])(.+)$/gm, '<p>$1</p>')
        .replace(/<p><\/p>/g, '')
        .replace(/\n/g, '');
    }
  </script>
